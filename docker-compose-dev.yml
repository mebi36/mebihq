version: '3.8'

services:
  frontend:
    image: node:16
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"  # Or whatever port Vite/webpack dev server uses
    command: sh -c "npm install && npm run serve -- --port 5173"
    environment:
      - CHOKIDAR_USEPOLLING=true  # Fix file watching issues in Docker
